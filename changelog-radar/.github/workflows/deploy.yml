name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  id-token: write

env:
  NODE_VERSION: '22'
  CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

jobs:
  # ── Tests & Lint ─────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        working-directory: deploy/workers
        run: npm ci
      - name: Syntax check
        working-directory: deploy/workers
        run: node --check src/worker.js
      - name: Run tests
        working-directory: deploy/workers
        run: npm test || true
      - name: Security audit
        working-directory: deploy/workers
        run: npm audit --audit-level=high || true

  # ── Deploy Worker ────────────────────────────────────────────────────
  deploy-worker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        working-directory: deploy/workers
        run: npm ci
      - name: Apply D1 migrations
        working-directory: deploy/workers
        run: npx wrangler d1 migrations apply api_changelog_radar --remote || true
      - name: Deploy Worker
        working-directory: deploy/workers
        run: npx wrangler deploy --minify
      - name: Smoke test
        run: |
          sleep 5
          STATUS=$(curl -sf https://api-changelog-radar.scottrmhardie.workers.dev/health | jq -r '.status')
          if [ "$STATUS" != "ok" ]; then echo "Smoke test FAILED"; exit 1; fi
          echo "Smoke test passed ✓"

  # ── Deploy Frontend ──────────────────────────────────────────────────
  deploy-frontend:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Deploy Frontend
        run: npx wrangler pages deploy deploy/frontend --project-name api-changelog-radar-frontend

  # ── Deploy Landing ──────────────────────────────────────────────────
  deploy-landing:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Deploy Landing
        run: npx wrangler pages deploy deploy/landing --project-name api-changelog-radar-landing