name = "comfyui-api"
main = "src/worker.js"
compatibility_date = "2024-06-01"

[vars]
ENVIRONMENT = "production"
APP_NAME = "comfyui-api"
LOG_LEVEL = "INFO"
LEASE_TIMEOUT_SECONDS = "180"
MAX_CONCURRENT_JOBS = "10"

[[d1_databases]]
binding = "DB"
database_name = "comfyui_api_db"
database_id = "placeholder-id"

[triggers]
crons = ["*/5 * * * *"]

# Observability
[observability]
enabled = true
head_sampling_rate = 1

# Optional custom domain configuration
# [[routes]]
# pattern = "api.comfyui.hardonian.com"
# custom_domain = true